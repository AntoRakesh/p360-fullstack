<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>People360</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('p360.theme') || '{}'), q = new URLSearchParams(location.search); if (q.get('mode')) { t = { mode: q.get('mode'), accent: q.get('accent') }; localStorage.setItem('p360.theme', JSON.stringify(t)); } var m = t.mode || 'light';
      if (m === 'system') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t.accent || 'violet';
      document.documentElement.dataset.mode = m;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
