<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>People360</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="purpleiq-logo.png">
  <link rel="apple-touch-icon" href="purpleiq-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      var t = JSON.parse(localStorage.getItem('p360.theme') || '{}'), q = new URLSearchParams(location.search); if (q.get('mode')) { t = { mode: q.get('mode'), accent: q.get('accent') }; localStorage.setItem('p360.theme', JSON.stringify(t)); } var m = t.mode || 'light';
      if (m === 'system') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t.accent || 'violet';
      document.documentElement.dataset.mode = m;
    } catch (e) {}
  </script>
  <style>
    .p360-splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #ffffff; z-index: 9999; }
    html[data-mode="dark"] .p360-splash { background: #0f0f17; }
    .p360-splash img { width: 96px; height: 96px; animation: p360-pulse 1.4s ease-in-out infinite; }
    html[data-mode="dark"] .p360-splash img { filter: brightness(0) invert(1); opacity: .9; }
    @keyframes p360-pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.9); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { .p360-splash img { animation: none; } }
  </style>
</head>
<body>
  <app-root>
    <div class="p360-splash" role="status" aria-label="Loading People360">
      <img src="purpleiq-logo.png" alt="">
    </div>
  </app-root>
</body>
</html>
